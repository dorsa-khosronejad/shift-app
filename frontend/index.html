<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shift &amp; Care · Sign in</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-brand">
    <div class="clock" id="liveClock">--:--</div>
    <p>Shift &amp; Care replaces the paper sign-in sheet at the front desk. Clock in, clock out, and flag anything that needs attention — all in one place.</p>
  </div>

  <div class="login-form-side">
    <div class="login-card">
      <div class="tabs">
        <button class="tab-btn active" type="button" id="signInTab">Sign in</button>
        <button class="tab-btn" type="button" id="signUpTab">Create account</button>
      </div>
      <h1 id="formTitle">Sign in</h1>
      <p id="formSubtitle">Use your work email and password.</p>

      <div class="alert alert-error alert-hidden" id="loginError"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary btn-block" id="loginBtn">Sign in</button>
      </form>
      <form id="signupForm" class="hidden">
        <div class="field"><label for="firstName">First name</label><input id="firstName" required autocomplete="given-name"></div>
        <div class="field"><label for="familyName">Family name</label><input id="familyName" required autocomplete="family-name"></div>
        <div class="field"><label for="businessId">Business ID</label><input id="businessId" required autocomplete="organization-title"></div>
        <div class="field"><label for="signupEmail">Work email</label><input type="email" id="signupEmail" required autocomplete="email"></div>
        <div class="field"><label for="signupPhone">Phone number</label><input type="tel" id="signupPhone" required autocomplete="tel"></div>
        <div class="field"><label for="signupPassword">Password</label><input type="password" id="signupPassword" required minlength="8" autocomplete="new-password"></div>
        <button type="submit" class="btn-primary btn-block" id="signupBtn">Create account</button>
      </form>
      <button type="button" class="btn-outline btn-block" id="forgotPasswordBtn">Forgot password?</button>
      <form id="forgotPasswordForm" class="hidden">
        <p>Verify your email and phone number, then choose a new password.</p>
        <div class="field"><label for="forgotEmail">Work email</label><input type="email" id="forgotEmail" required autocomplete="email"></div>
        <div class="field"><label for="forgotPhone">Phone number</label><input type="tel" id="forgotPhone" required autocomplete="tel"></div>
        <div class="field"><label for="forgotNewPassword">New password</label><input type="password" id="forgotNewPassword" required minlength="8" autocomplete="new-password"></div>
        <button type="submit" class="btn-primary btn-block">Request password reset</button>
      </form>
      <div class="alert alert-success alert-hidden" id="signupSuccess"></div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
function tick() {
  document.getElementById('liveClock').textContent =
    new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
tick();
setInterval(tick, 1000 * 30);

const form = document.getElementById('loginForm');
const errorBox = document.getElementById('loginError');
const btn = document.getElementById('loginBtn');
const loginForm = document.getElementById('loginForm');
const signupForm = document.getElementById('signupForm');
const signInTab = document.getElementById('signInTab');
const signUpTab = document.getElementById('signUpTab');
const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
const forgotPasswordForm = document.getElementById('forgotPasswordForm');

function showLogin() {
  signInTab.classList.add('active');
  signUpTab.classList.remove('active');
  loginForm.classList.remove('hidden');
  signupForm.classList.add('hidden');
  document.getElementById('formTitle').textContent = 'Sign in';
  document.getElementById('formSubtitle').textContent = 'Use your work email and password.';
  forgotPasswordBtn.classList.remove('hidden');
  forgotPasswordForm.classList.add('hidden');
}

function showSignup() {
  signUpTab.classList.add('active');
  signInTab.classList.remove('active');
  loginForm.classList.add('hidden');
  signupForm.classList.remove('hidden');
  document.getElementById('formTitle').textContent = 'Create account';
  document.getElementById('formSubtitle').textContent = 'Use your business details. An administrator will activate your account.';
  forgotPasswordBtn.classList.add('hidden');
  forgotPasswordForm.classList.add('hidden');
}

signInTab.addEventListener('click', showLogin);
signUpTab.addEventListener('click', showSignup);
forgotPasswordBtn.addEventListener('click', () => forgotPasswordForm.classList.toggle('hidden'));

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.classList.add('alert-hidden');
  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();

    if (!res.ok) {
      errorBox.textContent = data.error || 'Something went wrong. Try again.';
      errorBox.classList.remove('alert-hidden');
      return;
    }

    setSession(data.accessToken, data.user);
    window.location.href = roleHome(data.user.role);
  } catch (err) {
    errorBox.textContent = 'Could not reach the server. Is the backend running?';
    errorBox.classList.remove('alert-hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
});

signupForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const successBox = document.getElementById('signupSuccess');
  successBox.classList.add('alert-hidden');
  const res = await fetch(`${API_BASE}/auth/signup`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      firstName: document.getElementById('firstName').value,
      familyName: document.getElementById('familyName').value,
      businessId: document.getElementById('businessId').value,
      email: document.getElementById('signupEmail').value,
      phone: document.getElementById('signupPhone').value,
      password: document.getElementById('signupPassword').value,
    }),
  });
  const data = await res.json();
  if (!res.ok) {
    errorBox.textContent = data.error || 'Could not create account.';
    errorBox.classList.remove('alert-hidden');
    return;
  }
  signupForm.reset();
  successBox.textContent = data.message;
  successBox.classList.remove('alert-hidden');
});

forgotPasswordForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  const res = await fetch(`${API_BASE}/auth/forgot-password`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: document.getElementById('forgotEmail').value,
      phone: document.getElementById('forgotPhone').value,
      newPassword: document.getElementById('forgotNewPassword').value,
    }),
  });
  const data = await res.json();
  errorBox.textContent = data.error || data.message;
  errorBox.classList.remove('alert-hidden');
});

// If already logged in (valid refresh cookie), skip straight past login
(async () => {
  const refreshed = await tryRefresh();
  if (refreshed) {
    const meRes = await apiFetch('/auth/me');
    if (meRes.ok) {
      const { user } = await meRes.json();
      window.location.href = roleHome(user.role);
    }
  }
})();
</script>

</body>
</html>
